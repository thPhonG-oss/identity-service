spring:
  application:
    name: identity-service
  # No defaults: prod must provide these via environment variables.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m

logging:
  level:
    root: info
