spring:
  application:
    name: identity-service
  # No defaults: prod must provide these via environment variables.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # Flyway creates this schema if missing and keeps its history table here too.
    schemas: identity
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: identity

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m

logging:
  level:
    root: info
