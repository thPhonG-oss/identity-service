spring:
  application:
    name: identity-service
  # No defaults: prod must provide these via environment variables.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  flyway:
    # Flyway creates this schema if missing and keeps its history table here too.
    schemas: identity
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: identity
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: ${REDIRECT_URI}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-ttl: 15m
    refresh-token:
      ttl: 7d
    # The refresh token travels in this cookie, never in a response body (see RefreshTokenCookieFactory).
    refresh-cookie:
      secure: true
      same-site: STRICT
    # Browser origins allowed to call the API (the SPA). None by default.
    cors:
      allowed-origins: []
    oauth2:
      # Where the browser is sent after a login with Google: the SPA. No default, like the secrets.
      frontend-url: ${FRONTEND_URL}

logging:
  level:
    root: info
